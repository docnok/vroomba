<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vroomba</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="header">
      <pre class="ascii-banner">  _   __                    __       
 | | / /______  ___  __ _  / /  ___ _
 | |/ / __/ _ \/ _ \/  ' \/ _ \/ _ `/
 |___/_/  \___/\___/_/_/_/_.__/\_,_/ </pre>
      <span id="header-spinner" class="header-spinner hidden"></span>
      <span id="mode-badge" style="display:none"></span>
    </header>

    <div id="columns">
      <!-- Main column -->
      <main id="main-col">
        <!-- Camera feed -->
        <div class="panel" id="camera-panel">
          <div class="panel-header"><span class="panel-header-label">CAMERA</span></div>
          <div class="camera-feed-wrap">
            <img id="camera-feed" src="" alt="camera feed" class="hidden">
            <div id="camera-offline" class="camera-offline">NO SIGNAL</div>
          </div>
        </div>

        <div id="messages" class="panel">
          <div class="panel-header"><span class="panel-header-label">COMMS</span></div>
          <div id="message-list" class="scroll-area"></div>
        </div>
        <form id="input-form">
          <span class="prompt-char">▸</span>
          <input type="text" id="input-box" placeholder="Send a message…" autocomplete="off" autofocus>
          <button type="button" id="mic-btn"  class="input-btn" title="Voice input (click to speak)">mic</button>
          <button type="button" id="tts-btn"  class="input-btn tts-on" title="Toggle voice output">spk</button>
        </form>
        <!-- Footer status bar -->
        <footer id="footer-bar">
          <div class="footer-left">
            <span class="footer-dot" id="ft-dot-arduino"></span>
            <span class="footer-label">arduino</span>
            <span class="footer-sep">·</span>
            <span class="footer-dot" id="ft-dot-llm"></span>
            <span class="footer-label">llm</span>
            <span class="footer-sep">·</span>
            <span class="footer-dot" id="ft-dot-camera"></span>
            <span class="footer-label">cam</span>
            <span class="footer-sep">·</span>
            <span class="footer-label">mode:</span><span class="footer-mode" id="ft-mode">idle</span>
            <span class="footer-sep">·</span>
            <span class="footer-label">ctrl:</span><span class="footer-ctrl" id="ft-ctrl">·</span>
          </div>
          <div class="footer-right">
            <span class="footer-hint-key">esc</span> pause
            <span class="footer-sep">·</span>
            <span class="footer-hint-key">r</span> resume
            <span class="footer-sep">·</span>
            <span class="footer-hint-key">↑↓←→</span> drive
          </div>
        </footer>
      </main>

      <!-- Sidebar -->
      <aside id="sidebar">
        <!-- Autopilot panel (persona + camera pickers) -->
        <div class="panel" id="autopilot-panel">
          <div class="panel-header"><span class="panel-header-label">AUTOPILOT</span></div>
          <div class="ap-panel-body">
            <!-- Persona row -->
            <div class="ap-row" id="persona-row">
              <span class="ap-row-label">Persona:</span>
              <button class="ap-row-toggle" id="persona-toggle">
                <span class="ap-arrow" id="persona-arrow">▸</span>
                <span class="ap-row-value" id="persona-value">—</span>
              </button>
            </div>
            <div class="ap-expand hidden" id="persona-list"></div>

            <!-- Camera row -->
            <div class="ap-row" id="camera-row">
              <span class="ap-row-label">Camera:</span>
              <button class="ap-row-toggle" id="camera-toggle">
                <span class="ap-arrow" id="camera-arrow">▸</span>
                <span class="ap-row-value" id="camera-value">—</span>
              </button>
            </div>
            <div class="ap-expand hidden" id="camera-list"></div>
          </div>
        </div>

        <!-- Pause / Resume / Reset -->
        <div class="btn-row">
          <button id="pause-btn" title="Pause autopilot (Esc)">pause</button>
          <button id="resume-btn" title="Resume autopilot (r)">resume</button>
          <button id="reset-btn" title="Reset session">reset</button>
        </div>

        <!-- Turns panel -->
        <div class="panel" id="turns-panel">
          <div class="panel-header"><span class="panel-header-label">TURNS</span></div>
          <div id="turn-list" class="scroll-area"></div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Debug modal -->
  <div id="debug-modal" class="modal hidden">
    <div class="modal-content">
      <div class="panel-header"><span class="panel-header-label">DEBUG</span> <button id="debug-close" class="close-btn">✕</button></div>
      <pre id="debug-body" class="scroll-area"></pre>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
