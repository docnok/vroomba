<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vroomba</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="header">
      <span class="logo">▸ VROOMBA</span>
      <span class="mode-badge" id="mode-badge">[IDLE]</span>
    </header>

    <div id="columns">
      <!-- Main column -->
      <main id="main-col">
        <div id="messages" class="panel">
          <div class="panel-header"><span class="panel-header-label">COMMS</span></div>
          <div id="message-list" class="scroll-area"></div>
        </div>
        <form id="input-form">
          <span class="prompt-char">▸</span>
          <input type="text" id="input-box" placeholder="Send a message…" autocomplete="off" autofocus>
          <button type="button" id="mic-btn"  class="input-btn" title="Voice input (click to speak)">mic</button>
          <button type="button" id="tts-btn"  class="input-btn tts-on" title="Toggle voice output">spk</button>
        </form>
        <!-- Footer status bar -->
        <footer id="footer-bar">
          <div class="footer-left">
            <span class="footer-dot" id="ft-dot-arduino"></span>
            <span class="footer-label">arduino</span>
            <span class="footer-sep">·</span>
            <span class="footer-dot" id="ft-dot-llm"></span>
            <span class="footer-label">llm</span>
            <span class="footer-sep">·</span>
            <span class="footer-label">mode:</span><span class="footer-mode" id="ft-mode">idle</span>
            <span class="footer-sep">·</span>
            <span class="footer-label">ctrl:</span><span class="footer-ctrl" id="ft-ctrl">·</span>
          </div>
          <div class="footer-right">
            <span class="footer-hint-key">esc</span> pause
            <span class="footer-sep">·</span>
            <span class="footer-hint-key">↑↓←→</span> drive
          </div>
        </footer>
      </main>

      <!-- Sidebar -->
      <aside id="sidebar">
        <!-- Autopilot picker -->
        <div class="sidebar-section">
          <div class="sidebar-label">AUTOPILOT</div>
          <div id="pilot-picker" class="pilot-picker">
            <button id="pilot-picker-btn" class="pilot-picker-btn">—</button>
            <div id="pilot-picker-menu" class="pilot-picker-menu hidden"></div>
          </div>
        </div>

        <!-- Pause / Reset -->
        <div class="btn-row">
          <button id="pause-btn" title="Pause autopilot (Esc)">pause</button>
          <button id="reset-btn" title="Reset session">reset</button>
        </div>

        <!-- Turns panel -->
        <div class="panel" id="turns-panel">
          <div class="panel-header"><span class="panel-header-label">TURNS</span></div>
          <div id="turn-list" class="scroll-area"></div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Debug modal -->
  <div id="debug-modal" class="modal hidden">
    <div class="modal-content">
      <div class="panel-header"><span class="panel-header-label">DEBUG</span> <button id="debug-close" class="close-btn">✕</button></div>
      <pre id="debug-body" class="scroll-area"></pre>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
